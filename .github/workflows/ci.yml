name: ci
on: [push, pull_request]

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y cups cups-filters ghostscript
      - run: pip install -e "./host[pdf,test]"
      - run: python3 tools/hp45_tables.py
      - run: python3 -m pytest -q host/tests

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: |
          git clone -q --depth 1 -b 2.1.1 https://github.com/raspberrypi/pico-sdk "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update -q --init --depth 1 lib/tinyusb
      - run: |
          cmake -S firmware -B firmware/build -DCMAKE_BUILD_TYPE=Release -DPICO_SDK_PATH="$RUNNER_TEMP/pico-sdk"
          make -C firmware/build -j4
      - uses: actions/upload-artifact@v4
        with: { name: freejet-firmware, path: firmware/build/freejet.uf2 }

  cad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y openscad
      - run: make -C cad -j4 -B
      - uses: actions/upload-artifact@v4
        with: { name: freejet-stl, path: cad/stl }
